<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="45%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#030306"/>
    </linearGradient>

    <!-- Aurora Luminescence Glows -->
    <radialGradient id="auroraBlue" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#007AFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraPurple" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#BF5AF2" stop-opacity="0.40"/>
      <stop offset="65%" stop-color="#5E5CE6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraCoral" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#FF375F" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#FF9F0A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Liquid Glass Gradients -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.60"/>
    </linearGradient>

    <linearGradient id="sheenBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Apple Metallic Badge Gradient -->
    <linearGradient id="appleLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#8E8E93"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0A84FF" flood-opacity="0.25"/>
    </filter>

    <filter id="pillShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Embedded High-Performance CSS Animations -->
    <style>
      @keyframes floatPrimary {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(0.4deg); }
      }
      @keyframes floatSecondary {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(-0.8deg); }
      }
      @keyframes floatTertiary {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes auroraPulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1.0; transform: scale(1.08); }
      }
      @keyframes sheenSweep {
        0% { transform: translateX(-350px) skewX(-25deg); opacity: 0; }
        20% { opacity: 0.8; }
        60% { opacity: 0.8; }
        100% { transform: translateX(750px) skewX(-25deg); opacity: 0; }
      }
      @keyframes gridDrift {
        0% { transform: translateY(0px); }
        100% { transform: translateY(24px); }
      }
      .card-float-1 { animation: floatPrimary 6s ease-in-out infinite; }
      .card-float-2 { animation: floatSecondary 5.2s ease-in-out infinite; }
      .card-float-3 { animation: floatTertiary 7s ease-in-out infinite; }
      .aurora-anim { animation: auroraPulse 8s ease-in-out infinite; transform-origin: center; }
      .sheen-anim { animation: sheenSweep 6.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="900" height="380" rx="24" fill="url(#bgGrad)"/>

  <!-- 3D Isometric Perspective Floor Grid -->
  <g opacity="0.18">
    <path d="M-100,280 L1000,280 M-100,310 L1000,310 M-100,340 L1000,340 M-100,370 L1000,370" stroke="#0A84FF" stroke-width="1"/>
    <path d="M150,250 L-50,380 M300,250 L180,380 M450,250 L410,380 M600,250 L640,380 M750,250 L870,380 M900,250 L1100,380" stroke="#BF5AF2" stroke-width="1"/>
  </g>

  <!-- Animated Aurora Lights -->
  <g class="aurora-anim">
    <ellipse cx="280" cy="140" rx="260" ry="160" fill="url(#auroraBlue)"/>
    <ellipse cx="640" cy="180" rx="280" ry="170" fill="url(#auroraPurple)"/>
    <ellipse cx="460" cy="270" rx="220" ry="120" fill="url(#auroraCoral)"/>
  </g>

  <!-- BACKGROUND 3D GLASS PILL: Spring Physics HUD -->
  <g class="card-float-2" transform="translate(540, 48)">
    <rect width="280" height="64" rx="20" fill="url(#glassSurface)" stroke="url(#specularBorder)" stroke-width="1.2" filter="url(#pillShadow)"/>
    <circle cx="28" cy="32" r="10" fill="#30D158" opacity="0.85"/>
    <circle cx="28" cy="32" r="14" fill="#30D158" opacity="0.25"/>
    <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="600" fill="#EBEBF5" letter-spacing="0.5">SPRING PHYSICS</text>
    <text x="52" y="46" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" fill="#8E8E93">stiffness: 450 · damp: 28</text>
  </g>

  <!-- PRIMARY 3D LIQUID GLASS HERO CONTAINER -->
  <g class="card-float-1" transform="translate(90, 80)">
    <!-- Container Body with Specular Highlight and Shadow -->
    <rect width="520" height="230" rx="28" fill="url(#glassSurface)" stroke="url(#specularBorder)" stroke-width="1.5" filter="url(#shadow3D)"/>

    <!-- Light Sheen Sweep across Glass Surface (Clipped) -->
    <g clip-path="url(#heroClip)">
      <clipPath id="heroClip">
        <rect width="520" height="230" rx="28"/>
      </clipPath>
      <rect class="sheen-anim" x="0" y="0" width="180" height="230" fill="url(#sheenBeam)"/>
    </g>

    <!-- Apple Iconic Monogram / Chrome Logo -->
    <g transform="translate(42, 38) scale(1.15)">
      <path d="M15.22,12.9 C15.2,9.95 17.62,8.32 17.73,8.25 C16.35,6.26 14.22,5.97 13.48,5.94 C11.67,5.75 9.91,7.02 8.99,7.02 C8.05,7.02 6.64,5.96 5.15,5.99 C3.22,6.02 1.43,7.12 0.44,8.85 C-1.58,12.37 0.07,17.57 1.89,20.2 C2.78,21.49 3.8,22.94 5.19,22.89 C6.55,22.83 7.07,22.01 8.68,22.01 C10.27,22.01 10.76,22.89 12.16,22.86 C13.62,22.83 14.54,21.54 15.42,20.24 C16.45,18.75 16.86,17.29 16.9,17.21 C16.86,17.18 15.24,16.56 15.22,12.9 Z" fill="url(#appleLogoGrad)"/>
      <path d="M11.95,3.95 C12.75,2.97 13.3,1.63 13.15,0.27 C12.01,0.32 10.58,1.04 9.77,2 C9.05,2.83 8.43,4.2 8.6,5.53 C9.88,5.63 11.19,4.95 11.95,3.95 Z" fill="url(#appleLogoGrad)"/>
    </g>

    <!-- Super Apple Design Title -->
    <text x="82" y="58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="-0.6">Super Apple Design</text>
    <text x="82" y="80" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500" fill="#0A84FF" letter-spacing="0.2">AUTONOMOUS MULTI-AGENT PRODUCTION ENGINE</text>

    <!-- Feature Pillars Tags -->
    <g transform="translate(42, 114)">
      <!-- Tag 1 -->
      <rect width="132" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#0A84FF"/>
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#F2F2F7">Apple HIG Native</text>

      <!-- Tag 2 -->
      <rect x="144" width="138" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <circle cx="160" cy="17" r="4" fill="#BF5AF2"/>
      <text x="172" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#F2F2F7">Liquid Glass Lab</text>

      <!-- Tag 3 -->
      <rect x="294" width="138" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <circle cx="310" cy="17" r="4" fill="#30D158"/>
      <text x="322" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#F2F2F7">4-Phase Engine</text>
    </g>

    <!-- Bottom Metrics Strip -->
    <g transform="translate(42, 172)">
      <line x1="0" y1="0" x2="436" y2="0" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">4px Grid Rhythm</text>
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#8E8E93">Strict Spacing Scale</text>

      <text x="156" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">44px Hit Bounds</text>
      <text x="156" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#8E8E93">Touch Ergonomics</text>

      <text x="312" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">WCAG AA 4.5:1</text>
      <text x="312" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#8E8E93">Zero Contrast Flaws</text>
    </g>
  </g>

  <!-- FLOATING 3D GLASS CARD: Multi-Stack Badge -->
  <g class="card-float-3" transform="translate(630, 160)">
    <rect width="210" height="150" rx="24" fill="url(#glassSurface)" stroke="url(#specularBorder)" stroke-width="1.2" filter="url(#shadow3D)"/>
    
    <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">MULTI-STACK</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#8E8E93">Native Component Blueprints</text>

    <!-- Stack Pills -->
    <g transform="translate(24, 72)">
      <rect width="76" height="24" rx="12" fill="rgba(10,132,255,0.2)" stroke="#0A84FF" stroke-width="0.8"/>
      <text x="14" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#0A84FF">React 19</text>

      <rect x="84" width="76" height="24" rx="12" fill="rgba(191,90,242,0.2)" stroke="#BF5AF2" stroke-width="0.8"/>
      <text x="96" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#BF5AF2">SwiftUI</text>

      <rect y="32" width="76" height="24" rx="12" fill="rgba(48,209,88,0.2)" stroke="#30D158" stroke-width="0.8"/>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#30D158">Flutter</text>

      <rect x="84" y="32" width="76" height="24" rx="12" fill="rgba(255,159,10,0.2)" stroke="#FF9F0A" stroke-width="0.8"/>
      <text x="94" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#FF9F0A">Tailwind</text>
    </g>
  </g>
</svg>
