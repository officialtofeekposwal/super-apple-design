<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060A"/>
      <stop offset="50%" stop-color="#0B0B14"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="compGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Specular Hairline Gradients -->
    <linearGradient id="specBorderCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#64D2FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="specBorderIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#5E5CE6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="specBorderEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#30D158" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="compShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sheen Sweep Clip Path -->
    <clipPath id="cardClip1">
      <rect x="30" y="35" width="250" height="200" rx="20"/>
    </clipPath>
    <clipPath id="cardClip2">
      <rect x="325" y="35" width="250" height="200" rx="20"/>
    </clipPath>
    <clipPath id="cardClip3">
      <rect x="620" y="35" width="250" height="200" rx="20"/>
    </clipPath>
  </defs>

  <style>
    .comp-bg { fill: url(#compBg); }
    .grid-line { stroke: rgba(255, 255, 255, 0.035); stroke-width: 1; }
    
    /* 3D Floating Animations */
    @keyframes compFloatA {
      0%, 100% { transform: translateY(0px) rotate(0.001deg); }
      50% { transform: translateY(-8px) rotate(0.5deg); }
    }
    @keyframes compFloatB {
      0%, 100% { transform: translateY(0px) rotate(0.001deg); }
      50% { transform: translateY(-11px) rotate(-0.5deg); }
    }
    @keyframes compFloatC {
      0%, 100% { transform: translateY(0px) rotate(0.001deg); }
      50% { transform: translateY(-7px) rotate(0.4deg); }
    }
    @keyframes sheenSweepComp {
      0% { transform: translateX(-350px) rotate(25deg); opacity: 0; }
      20% { opacity: 0.8; }
      50% { transform: translateX(450px) rotate(25deg); opacity: 0; }
      100% { transform: translateX(450px) rotate(25deg); opacity: 0; }
    }
    @keyframes pulseRing {
      0% { r: 5px; opacity: 0.9; }
      50% { r: 12px; opacity: 0.15; }
      100% { r: 5px; opacity: 0.9; }
    }
    @keyframes cursorTap {
      0%, 100% { transform: scale(1); }
      40% { transform: scale(0.94); }
      60% { transform: scale(0.97); }
    }
    @keyframes segSwitch {
      0%, 45% { transform: translateX(0px); }
      55%, 95% { transform: translateX(110px); }
      100% { transform: translateX(0px); }
    }

    .card-a { animation: compFloatA 6s ease-in-out infinite; transform-origin: 155px 135px; }
    .card-b { animation: compFloatB 6.8s ease-in-out infinite 0.6s; transform-origin: 450px 135px; }
    .card-c { animation: compFloatC 6.2s ease-in-out infinite 1.2s; transform-origin: 745px 135px; }
    
    .sheen-comp-1 { animation: sheenSweepComp 6.5s ease-in-out infinite 1s; }
    .sheen-comp-2 { animation: sheenSweepComp 6.5s ease-in-out infinite 2.2s; }
    .sheen-comp-3 { animation: sheenSweepComp 6.5s ease-in-out infinite 3.4s; }

    .pulse-dot { animation: pulseRing 2.5s ease-in-out infinite; }
    .interactive-btn { animation: cursorTap 3.5s ease-in-out infinite; transform-origin: 745px 190px; }
    .seg-pill { animation: segSwitch 5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="900" height="280" rx="20" class="comp-bg"/>
  <rect width="900" height="280" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Perspective Perspective Floor Grid -->
  <g opacity="0.7">
    <line x1="0" y1="260" x2="900" y2="260" class="grid-line"/>
    <line x1="0" y1="230" x2="900" y2="230" class="grid-line"/>
    <line x1="0" y1="200" x2="900" y2="200" class="grid-line"/>
    <line x1="50" y1="280" x2="200" y2="180" class="grid-line"/>
    <line x1="250" y1="280" x2="350" y2="180" class="grid-line"/>
    <line x1="450" y1="280" x2="450" y2="180" class="grid-line"/>
    <line x1="650" y1="280" x2="550" y2="180" class="grid-line"/>
    <line x1="850" y1="280" x2="700" y2="180" class="grid-line"/>
  </g>

  <!-- ==================== CARD 1: 3D DYNAMIC ISLAND & HUD ==================== -->
  <g class="card-a">
    <!-- Ambient Shadow -->
    <rect x="30" y="35" width="250" height="200" rx="20" filter="url(#compShadow)" fill="#07070E"/>
    <!-- Glass Surface -->
    <rect x="30" y="35" width="250" height="200" rx="20" fill="url(#compGlass)"/>
    <!-- Specular Rim -->
    <rect x="30" y="35" width="250" height="200" rx="20" fill="none" stroke="url(#specBorderCyan)" stroke-width="1.2"/>

    <!-- Light Sheen Sweep -->
    <g clip-path="url(#cardClip1)">
      <rect class="sheen-comp-1" x="-100" y="-50" width="80" height="350" fill="rgba(255,255,255,0.15)"/>
    </g>

    <!-- Header Badge -->
    <rect x="48" y="52" width="76" height="20" rx="10" fill="rgba(10,132,255,0.18)" stroke="rgba(10,132,255,0.4)" stroke-width="1"/>
    <text x="86" y="66" fill="#64D2FF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">SPATIAL HUD</text>

    <!-- Floating Dynamic Island Capsule -->
    <rect x="55" y="90" width="200" height="42" rx="21" fill="#000000" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    
    <!-- Pulse sensor dot -->
    <circle cx="78" cy="111" r="5" fill="#30D158" filter="url(#glowCyan)"/>
    <circle class="pulse-dot" cx="78" cy="111" r="8" fill="none" stroke="#30D158" stroke-width="1.5"/>

    <text x="100" y="115" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600">Spatial Audio</text>
    <text x="235" y="115" fill="#64D2FF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="700" text-anchor="end">48 kHz</text>

    <!-- Waveform Visualizer Bars -->
    <g transform="translate(60, 155)">
      <rect x="0" y="10" width="4" height="24" rx="2" fill="#0A84FF"/>
      <rect x="8" y="4" width="4" height="30" rx="2" fill="#5E5CE6"/>
      <rect x="16" y="14" width="4" height="20" rx="2" fill="#BF5AF2"/>
      <rect x="24" y="0" width="4" height="34" rx="2" fill="#64D2FF"/>
      <rect x="32" y="8" width="4" height="26" rx="2" fill="#0A84FF"/>
      <rect x="40" y="18" width="4" height="16" rx="2" fill="#5E5CE6"/>
    </g>

    <text x="120" y="172" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600">visionOS Glass</text>
    <text x="120" y="188" fill="rgba(255,255,255,0.5)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5">Multi-layer specular sheen</text>
    <text x="120" y="202" fill="#64D2FF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9" font-weight="600">blur(24px) saturate(180%)</text>
  </g>

  <!-- ==================== CARD 2: 3D SEGMENTED CONTROL & TACTILE SWITCH ==================== -->
  <g class="card-b">
    <!-- Ambient Shadow -->
    <rect x="325" y="35" width="250" height="200" rx="20" filter="url(#compShadow)" fill="#07070E"/>
    <!-- Glass Surface -->
    <rect x="325" y="35" width="250" height="200" rx="20" fill="url(#compGlass)"/>
    <!-- Specular Rim -->
    <rect x="325" y="35" width="250" height="200" rx="20" fill="none" stroke="url(#specBorderIndigo)" stroke-width="1.2"/>

    <!-- Light Sheen Sweep -->
    <g clip-path="url(#cardClip2)">
      <rect class="sheen-comp-2" x="-100" y="-50" width="80" height="350" fill="rgba(255,255,255,0.15)"/>
    </g>

    <!-- Header Badge -->
    <rect x="343" y="52" width="94" height="20" rx="10" fill="rgba(94,92,230,0.18)" stroke="rgba(94,92,230,0.4)" stroke-width="1"/>
    <text x="390" y="66" fill="#BF5AF2" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">SEGMENTED</text>

    <!-- Segmented Control Housing -->
    <rect x="340" y="90" width="220" height="38" rx="19" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Animated Active Segment Pill -->
    <rect class="seg-pill" x="343" y="93" width="104" height="32" rx="16" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

    <text x="395" y="113" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Cupertino</text>
    <text x="505" y="113" fill="rgba(255,255,255,0.7)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" text-anchor="middle">Spatial 3D</text>

    <!-- Mini Progress / Slider Gauge -->
    <g transform="translate(345, 148)">
      <text x="0" y="0" fill="rgba(255,255,255,0.6)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600">Spring Physics (Damping 0.85)</text>
      <!-- Track -->
      <rect x="0" y="10" width="210" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
      <!-- Active fill -->
      <rect x="0" y="10" width="145" height="6" rx="3" fill="url(#specBorderIndigo)"/>
      <!-- Thumb -->
      <circle cx="145" cy="13" r="8" fill="#FFFFFF" filter="url(#glowCyan)"/>
      <circle cx="145" cy="13" r="3" fill="#5E5CE6"/>
    </g>

    <text x="345" y="195" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600">44px Touch Bounds</text>
    <text x="345" y="210" fill="rgba(255,255,255,0.5)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5">Haptic response · 5-state complete</text>
  </g>

  <!-- ==================== CARD 3: 3D HAPTIC BUTTON & ACCESSIBILITY GATE ==================== -->
  <g class="card-c">
    <!-- Ambient Shadow -->
    <rect x="620" y="35" width="250" height="200" rx="20" filter="url(#compShadow)" fill="#07070E"/>
    <!-- Glass Surface -->
    <rect x="620" y="35" width="250" height="200" rx="20" fill="url(#compGlass)"/>
    <!-- Specular Rim -->
    <rect x="620" y="35" width="250" height="200" rx="20" fill="none" stroke="url(#specBorderEmerald)" stroke-width="1.2"/>

    <!-- Light Sheen Sweep -->
    <g clip-path="url(#cardClip3)">
      <rect class="sheen-comp-3" x="-100" y="-50" width="80" height="350" fill="rgba(255,255,255,0.15)"/>
    </g>

    <!-- Header Badge -->
    <rect x="638" y="52" width="84" height="20" rx="10" fill="rgba(48,209,88,0.18)" stroke="rgba(48,209,88,0.4)" stroke-width="1"/>
    <text x="680" y="66" fill="#30D158" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">WCAG AA 4.5:1</text>

    <!-- Interactive Glass Action Button -->
    <g class="interactive-btn">
      <rect x="640" y="88" width="210" height="44" rx="22" fill="#0A84FF" filter="url(#glowCyan)"/>
      <!-- Inner Specular Ridge -->
      <path d="M 662 90 Q 745 92 828 90" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" fill="none"/>
      
      <!-- Apple SF Symbol Monogram -->
      <g transform="translate(680, 101)" fill="#FFFFFF">
        <path d="M10 2L3 9L4.4 10.4L9 5.8V16H11V5.8L15.6 10.4L17 9L10 2Z"/>
      </g>
      
      <text x="750" y="115" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Ship Production</text>
    </g>

    <!-- Pre-Flight Checklist Checkpoints -->
    <g transform="translate(640, 150)">
      <circle cx="8" cy="8" r="7" fill="rgba(48,209,88,0.2)" stroke="#30D158" stroke-width="1.2"/>
      <path d="M5 8 L7 10 L11 6" stroke="#30D158" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="22" y="12" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600">Zero Contrast Failures</text>

      <circle cx="8" cy="30" r="7" fill="rgba(48,209,88,0.2)" stroke="#30D158" stroke-width="1.2"/>
      <path d="M5 30 L7 32 L11 28" stroke="#30D158" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="22" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="600">Continuous Squircles (60%)</text>

      <circle cx="8" cy="52" r="7" fill="rgba(48,209,88,0.2)" stroke="#30D158" stroke-width="1.2"/>
      <path d="M5 52 L7 54 L11 50" stroke="#30D158" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="22" y="56" fill="#30D158" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="700">20/20 SHIPPING GATES PASS</text>
    </g>
  </g>
</svg>