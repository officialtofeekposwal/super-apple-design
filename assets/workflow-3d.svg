<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080E"/>
      <stop offset="100%" stop-color="#040407"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="wfGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Specular Highlight Borders -->
    <linearGradient id="borderBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="borderGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#30D158" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="borderPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BF5AF2" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="borderOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF9F0A" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="wfCardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes floatCard1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      @keyframes floatCard2 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
      @keyframes floatCard3 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
      @keyframes floatCard4 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-11px); } }
      @keyframes connectorPulse { 0%, 100% { stroke-dashoffset: 0; opacity: 0.4; } 50% { stroke-dashoffset: -20; opacity: 0.9; } }
      
      .c1 { animation: floatCard1 5.5s ease-in-out infinite; }
      .c2 { animation: floatCard2 6.2s ease-in-out infinite; }
      .c3 { animation: floatCard3 5.0s ease-in-out infinite; }
      .c4 { animation: floatCard4 6.8s ease-in-out infinite; }
      .pulse-wire { stroke-dasharray: 6 6; animation: connectorPulse 3s linear infinite; }
    </style>
  </defs>

  <rect width="900" height="240" rx="20" fill="url(#wfBg)"/>

  <!-- Glowing Connecting Energy Wires -->
  <path d="M210,120 L245,120 M425,120 L460,120 M640,120 L675,120" stroke="#0A84FF" stroke-width="2.5" class="pulse-wire"/>

  <!-- CARD 1: DIRECTION -->
  <g class="c1" transform="translate(30, 42)">
    <rect width="180" height="156" rx="20" fill="url(#wfGlass)" stroke="url(#borderBlue)" stroke-width="1.2" filter="url(#wfCardShadow)"/>
    <circle cx="28" cy="30" r="12" fill="#0A84FF" opacity="0.2"/>
    <text x="28" y="35" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0A84FF" text-anchor="middle">1</text>
    <text x="50" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">DIRECTION</text>
    
    <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EBEBF5">• 3 Creative Concepts</text>
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EBEBF5">• Lock Design Tokens</text>
    <text x="20" y="112" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EBEBF5">• Continuous Squircles</text>
    
    <rect x="20" y="126" width="140" height="18" rx="9" fill="rgba(10,132,255,0.18)"/>
    <text x="90" y="139" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#0A84FF" text-anchor="middle">GATE: NO CODE YET</text>
  </g>

  <!-- CARD 2: BUILD -->
  <g class="c2" transform="translate(245, 42)">
    <rect width="180" height="156" rx="20" fill="url(#wfGlass)" stroke="url(#borderGreen)" stroke-width="1.2" filter="url(#wfCardShadow)"/>
    <circle cx="28" cy="30" r="12" fill="#30D158" opacity="0.2"/>
    <text x="28" y="35" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#30D158" text-anchor="middle">2</text>
    <text x="50" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">BUILD</text>

    <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EBEBF5">• 4px Grid Rhythm</text>
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EBEBF5">• 44px Touch Targets</text>
    <text x="20" y="112" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EBEBF5">• Liquid Glass Controls</text>

    <rect x="20" y="126" width="140" height="18" rx="9" fill="rgba(48,209,88,0.18)"/>
    <text x="90" y="139" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#30D158" text-anchor="middle">TACTILE HARMONY</text>
  </g>

  <!-- CARD 3: TEST -->
  <g class="c3" transform="translate(460, 42)">
    <rect width="180" height="156" rx="20" fill="url(#wfGlass)" stroke="url(#borderPurple)" stroke-width="1.2" filter="url(#wfCardShadow)"/>
    <circle cx="28" cy="30" r="12" fill="#BF5AF2" opacity="0.2"/>
    <text x="28" y="35" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#BF5AF2" text-anchor="middle">3</text>
    <text x="50" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">TEST</text>

    <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EBEBF5">• Playwright Matrix</text>
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EBEBF5">• 375 / 768 / 1280px</text>
    <text x="20" y="112" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EBEBF5">• Light &amp; Dark QA</text>

    <rect x="20" y="126" width="140" height="18" rx="9" fill="rgba(191,90,242,0.18)"/>
    <text x="90" y="139" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#BF5AF2" text-anchor="middle">6-STATE SCREENSHOTS</text>
  </g>

  <!-- CARD 4: REVIEW -->
  <g class="c4" transform="translate(675, 42)">
    <rect width="180" height="156" rx="20" fill="url(#wfGlass)" stroke="url(#borderOrange)" stroke-width="1.2" filter="url(#wfCardShadow)"/>
    <circle cx="28" cy="30" r="12" fill="#FF9F0A" opacity="0.2"/>
    <text x="28" y="35" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FF9F0A" text-anchor="middle">4</text>
    <text x="50" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">REVIEW</text>

    <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EBEBF5">• Senior Critique</text>
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EBEBF5">• WCAG AA Contrast</text>
    <text x="20" y="112" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#EBEBF5">• 20-Point Gate</text>

    <rect x="20" y="126" width="140" height="18" rx="9" fill="rgba(255,159,10,0.18)"/>
    <text x="90" y="139" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#FF9F0A" text-anchor="middle">SHIPPING APPROVAL</text>
  </g>
</svg>
